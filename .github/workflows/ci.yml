name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        uses: moonbit-community/setup-moonbit@main
        with:
          version: latest

      - name: Show versions
        run: moon version --all

      - name: Update module registry
        run: moon update

      - name: Check (all targets)
        run: |
          set +e
          out=$(moon check --target all --deny-warn 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            enc=$(printf '%s' "$out" | python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))')
            echo "::error::$enc"
            exit $code
          fi

      - name: Build (all targets)
        run: |
          set +e
          out=$(moon build --target all 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep -E "Error|error\[|error:" | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit $code
          fi

      - name: Test (all targets)
        run: |
          set +e
          out=$(moon test --target all 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep "Total tests" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit $code
          fi

      - name: Demo smoke test over localhost
        run: |
          moon run cmd/main --target native &
          PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/ | grep -q "hello from"
          curl -sf http://127.0.0.1:18080/api/users | grep -q "hello from"
          kill $PID
