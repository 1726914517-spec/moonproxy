name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        uses: moonbit-community/setup-moonbit@main
        with:
          version: latest

      - name: Show versions
        run: moon version --all

      - name: Update module registry
        run: moon update

      - name: Check (all targets)
        run: |
          set +e
          out=$(moon check --target all --deny-warn 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            enc=$(printf '%s' "$out" | python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))')
            echo "::error::$enc"
            exit $code
          fi

      - name: Build (all targets)
        run: |
          set +e
          out=$(moon build --target all 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep -E "Error|error\[|error:" | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit $code
          fi

      - name: Test (all targets)
        run: |
          set +e
          out=$(moon test --target all 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep "Total tests" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit $code
          fi

      - name: Demo smoke test (routing, 429, 413, route ids)
        run: |
          moon run cmd/main --target native > /tmp/demo.log 2>&1 &
          PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/ | grep -q "hello from"
          curl -sf http://127.0.0.1:18080/api/users | grep -q "hello from"
          # Let the bucket refill after the readiness probes.
          sleep 2
          # 20 requests, not 12: a slow runner can refill a few tokens mid-burst,
          # and the assertion is that the limit is crossed at some point.
          burst=$(curl -s $(printf -- '-o /dev/null http://127.0.0.1:18080/ %.0s' {1..20}) -w '%{http_code} ')
          echo "global burst: $burst"
          echo "$burst" | grep -q "429"
          oks=$(echo "$burst" | grep -o "200" | wc -l)
          test "$oks" -ge 10
          api=$(curl -s $(printf -- '-o /dev/null http://127.0.0.1:18080/api/users %.0s' {1..6}) -w '%{http_code} ')
          echo "api burst: $api"
          echo "$api" | grep -q "429"
          test "$(echo "$api" | grep -o "200" | wc -l)" -ge 2
          head -c 2048 /dev/zero > /tmp/big.file
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/ --data-binary @/tmp/big.file)
          echo "oversized body: $code"
          test "$code" = "413"
          # Stop the demo before inspecting its log: stdout redirected to a file
          # is block-buffered, so the records are only guaranteed to be on disk
          # once the process exits and flushes them.
          kill $PID 2>/dev/null || true
          sleep 2
          # If `moon run` only spawned the binary, the listener is still up and
          # still holding buffered output; stop it and give it a moment to flush.
          if curl -s -o /dev/null --max-time 1 http://127.0.0.1:18080/; then
            # Match the built binary's path, not the whole `cmd/main` substring:
            # a broad -f pattern could also match this step's own shell.
            pkill -f "build/cmd/main/main" || true
            sleep 2
          fi
          grep -q '"route_id":"root"' /tmp/demo.log
          echo "access log carries the matched route id"
